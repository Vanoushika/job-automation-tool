name: Daily Job Pipeline

on:
  schedule:
    - cron: '0 12-23 * * 1-5'  # Every hour, 8 AM–7 PM EST (12–23 UTC), Mon–Fri
  workflow_dispatch:              # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create resume files
        run: |
          mkdir -p data/resumes
          echo "${{ secrets.RESUME_AI }}"        > data/resumes/resume_ai.txt
          echo "${{ secrets.RESUME_FULLSTACK }}" > data/resumes/resume_fullstack.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python run_daily.py --no-email

      - name: Push jobs to data branch via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get current file SHA (needed to update existing file)
          SHA=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/Vanoushika/job-automation-tool/contents/jobs_output.json?ref=data" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")

          # Build and upload payload via Python to handle large content safely
          python3 - <<'PYEOF'
import json, base64, os, subprocess, urllib.request

token = os.environ["GITHUB_TOKEN"]
sha   = os.popen("echo $SHA").read().strip()

with open("jobs_output.json", "rb") as f:
    content = base64.b64encode(f.read()).decode()

payload = {
    "message": "Jobs update",
    "content": content,
    "branch":  "data",
}
if sha:
    payload["sha"] = sha

data = json.dumps(payload).encode()
req  = urllib.request.Request(
    "https://api.github.com/repos/Vanoushika/job-automation-tool/contents/jobs_output.json",
    data=data,
    method="PUT",
    headers={
        "Authorization": f"token {token}",
        "Content-Type": "application/json",
    },
)
with urllib.request.urlopen(req) as resp:
    print(f"GitHub API response: {resp.status}")
PYEOF
