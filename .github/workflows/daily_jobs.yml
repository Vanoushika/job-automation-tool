name: Daily Job Pipeline

on:
  schedule:
    - cron: '0 12-23 * * 1-5'  # Every hour, 8 AM–7 PM EST (12–23 UTC), Mon–Fri
  workflow_dispatch:              # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create resume files
        run: |
          mkdir -p data/resumes
          echo "${{ secrets.RESUME_AI }}"        > data/resumes/resume_ai.txt
          echo "${{ secrets.RESUME_FULLSTACK }}" > data/resumes/resume_fullstack.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python run_daily.py --no-email

      - name: Push jobs to data branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git checkout --orphan data-tmp
          git reset --hard
          cp jobs_output.json jobs_output.json
          git add jobs_output.json
          git commit -m "Jobs update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:data --force
