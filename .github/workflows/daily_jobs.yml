name: Daily Job Pipeline

on:
  schedule:
    - cron: '0 12-23 * * 1-5'  # Every hour, 8 AM–7 PM EST (12–23 UTC), Mon–Fri
  workflow_dispatch:              # allow manual trigger from GitHub UI

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up Render (free tier sleeps after inactivity)
        run: curl -s https://job-automation-tool-i29m.onrender.com/health

      - name: Wait for Render to wake up
        run: sleep 40

      - name: Trigger pipeline on Render
        run: |
          curl -s -X POST https://job-automation-tool-i29m.onrender.com/api/run
          echo "Pipeline triggered on Render successfully"
